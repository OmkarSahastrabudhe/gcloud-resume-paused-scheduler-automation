stages:
  - validate
  - sync_schedulers

# Common (non-secret) settings shared by every environment
variables:
  GCP_REGION: "asia-south1"
  FUNCTION_NAME: "resume-schedulers-fn"
  SCHEDULER_NAME: "master-morning-resumer"
  TARGET_CRON: "0 8 * * *"
  TARGET_TZ: "Asia/Kolkata"
  PYTHON_RUNTIME: "python312"

# ---------------------------------------------------------
# Stage 1: cheap static checks (no GCP access needed)
# ---------------------------------------------------------
validate:
  stage: validate
  image: google/cloud-sdk:slim
  script:
    - bash -n deploy.sh
    - test -f ignore_list.txt || (echo "ignore_list.txt missing - every PAUSED job would be resumed" && exit 1)
  rules:
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------
# Shared deploy template
# ---------------------------------------------------------
.deploy_template:
  stage: sync_schedulers
  image: google/cloud-sdk:slim
  # GCP auth (same pattern as idfy/code/infra/cloud-functions/alertmanager-daily-summary):
  #   GOOGLE_AUTH = CI/CD variable holding a deployer SA key (raw JSON or base64, masked).
  #   If it is not set, the job falls back to the runner's own GCP identity.
  before_script:
    - apt-get update -qq && apt-get install -y -qq jq >/dev/null
    - |
      if [ -n "${GOOGLE_AUTH:-}" ]; then
        umask 077
        if printf '%s' "$GOOGLE_AUTH" | grep -q '^[[:space:]]*{'; then
          printf '%s' "$GOOGLE_AUTH" > "$CI_PROJECT_DIR/gcloud-key.json"
        else
          printf '%s' "$GOOGLE_AUTH" | base64 -d > "$CI_PROJECT_DIR/gcloud-key.json"
        fi
        gcloud auth activate-service-account --key-file "$CI_PROJECT_DIR/gcloud-key.json"
        rm -f "$CI_PROJECT_DIR/gcloud-key.json"
      else
        echo "GOOGLE_AUTH not set - using the runner's own GCP identity"
      fi
    - echo "CI identity -> $(gcloud config get-value account 2>/dev/null)"
    - echo "Target project -> ${GCP_PROJECT_ID}"
  script:
    - chmod +x ./deploy.sh
    - ./deploy.sh
  after_script:
    - rm -f "$CI_PROJECT_DIR/gcloud-key.json"

# ---------------------------------------------------------
# TEST: any non-default branch, IDfy test project, manual click
# ---------------------------------------------------------
deploy_test:
  extends: .deploy_template
  environment:
    name: test
  resource_group: schedulers-test
  variables:
    GCP_PROJECT_ID: "idfy-platform-dev"
    FUNCTION_SA_EMAIL: "scheduler-resumer-fn-sa@idfy-platform-dev.iam.gserviceaccount.com"
    SCHEDULER_SA_EMAIL: "scheduler-resumer-invoker-sa@idfy-platform-dev.iam.gserviceaccount.com"
    # BUILD_SA_EMAIL: ""   # optional; leave unset to use GCP's default Cloud Build SA
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual

# ---------------------------------------------------------
# PROD: default branch only, manual click (same as feature branches)
# ---------------------------------------------------------
deploy_prod:
  extends: .deploy_template
  environment:
    name: production
  resource_group: schedulers-production
  variables:
    GCP_PROJECT_ID: "<ADD_PROD_PROJECT_ID_HERE>"
    FUNCTION_SA_EMAIL: "scheduler-resumer-fn-sa@<ADD_PROD_PROJECT_ID_HERE>.iam.gserviceaccount.com"
    SCHEDULER_SA_EMAIL: "scheduler-resumer-invoker-sa@<ADD_PROD_PROJECT_ID_HERE>.iam.gserviceaccount.com"
    # BUILD_SA_EMAIL: ""
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
